<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Smile Report · Amend Dental Centre</title>
<link rel="icon" href="assets/img/amend-mark.png" />
<link rel="stylesheet" href="assets/css/styles.css" />
<style>
  body { padding-bottom: 90px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 36px 20px 20px; }
  .section { margin-top: 18px; }
  .section-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .section-sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .hero { text-align: center; padding: 40px 26px 30px; }
  .hero h1 { font-size: 34px; font-weight: 700; margin: 8px 0 6px; line-height: 1.12; }
  .ai-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--navy-soft); color: var(--navy);
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
  .ring-wrap { position: relative; width: 210px; height: 210px; margin: 26px auto 8px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-wrap circle.prog { transition: stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-center .num { font-size: 58px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .ring-center .of { font-size: 13px; color: #8e8e93; margin-top: 2px; }
  .chips { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .chip { background: #f5f5f7; border-radius: 14px; padding: 10px 16px; min-width: 110px; }
  .chip b { display: block; font-size: 20px; letter-spacing: -0.02em; }
  .chip span { font-size: 12px; color: var(--muted); }
  .summary { font-size: 17px; line-height: 1.65; color: #2c2c2e; margin: 0; }
  .summary-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .spark { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--navy), #3d67b3); color: #fff; font-size: 16px; }
  .cta-inline { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    background: var(--orange-soft); border: 1px solid #fde2c0; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .photos a { display: block; border-radius: 16px; overflow: hidden; aspect-ratio: 1; background: #f2f2f7; }
  .photos img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .photos a:hover img { transform: scale(1.04); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .metric { padding: 20px; }
  .metric-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .mini-ring { position: relative; width: 58px; height: 58px; flex-shrink: 0; }
  .mini-ring svg { transform: rotate(-90deg); }
  .mini-ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .metric h3 { margin: 0; font-size: 15px; }
  .metric p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
  .list-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f2f2f7; }
  .list-item:last-child { border-bottom: none; }
  .dot { width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }
  .li-title { font-weight: 600; font-size: 14.5px; }
  .li-loc { font-size: 12px; color: var(--muted); }
  .li-detail { font-size: 13.5px; color: #3a3a3c; margin-top: 3px; }
  .treat { display: flex; flex-direction: column; gap: 8px; padding: 20px; }
  .treat-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--navy-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .treat h3 { margin: 4px 0 0; font-size: 16px; }
  .treat p { margin: 0; font-size: 13.5px; color: var(--muted); flex: 1; }
  .treat a { font-size: 13.5px; font-weight: 600; color: var(--navy); text-decoration: none; }
  .tip { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; }
  .tip-num { width: 28px; height: 28px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .final-cta { text-align: center; padding: 44px 28px; }
  .final-cta h2 { font-size: 30px; margin: 8px 0 10px; color: #fff; }
  .final-cta p { color: rgba(255,255,255,.82); margin: 0 auto 24px; max-width: 460px; }
  .disclaimer { display: flex; gap: 14px; background: #fff; border: 1px solid var(--border); }
  .disclaimer p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .sticky-cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.88); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid rgba(0,0,0,.06); display: flex; gap: 10px; align-items: center; justify-content: center;
    transform: translateY(110%); transition: transform .35s cubic-bezier(.22,1,.36,1); }
  .sticky-cta.show { transform: none; }
  .sticky-cta .txt { font-size: 13px; color: var(--muted); }
  @media (max-width: 640px) {
    .hero h1 { font-size: 27px; } .final-cta h2 { font-size: 24px; }
    .sticky-cta .txt, .topbar .hide-sm { display: none; }
  }
  @media print { .topbar, .sticky-cta, .no-print { display: none !important; } body { padding: 0; } }
</style>
</head>
<body>
  <header class="topbar">
    <a id="logoLink" href="#" target="_blank" rel="noopener"><img class="logo" src="assets/img/amend-logo.png" alt="Amend Dental Centre" /></a>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm hide-sm" id="websiteBtnTop" href="#" target="_blank" rel="noopener">Visit website</a>
    <a class="btn btn-orange btn-sm" id="bookBtnTop" href="#" target="_blank" rel="noopener">Book free consultation</a>
  </header>

  <main class="wrap" id="reportRoot"><p class="center muted" style="padding:60px 0;">Loading your report…</p></main>

  <div class="sticky-cta no-print" id="stickyCta">
    <span class="txt">Free consultation · Limited slots</span>
    <a class="btn btn-orange" id="bookBtnSticky" href="#" target="_blank" rel="noopener">Book my free consultation →</a>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/alignment-diagram.js"></script>
  <script>
    const BOOK = cfg("BOOKING_URL", "#");
    const SITE = cfg("WEBSITE_URL", "#");
    const CLINIC = cfg("CLINIC_NAME", "Amend Dental Centre");
    ["bookBtnTop", "bookBtnSticky"].forEach((id) => (document.getElementById(id).href = BOOK));
    ["websiteBtnTop", "logoLink"].forEach((id) => (document.getElementById(id).href = SITE));

    const CATS = [
      { key: "alignment", label: "Alignment", icon: "🦷" },
      { key: "decayCavities", label: "Cavity check", icon: "🔍" },
      { key: "gumHealth", label: "Gum health", icon: "🌸" },
      { key: "enamelWear", label: "Enamel strength", icon: "🛡️" },
      { key: "stainingColor", label: "Shade & brightness", icon: "✨" },
    ];
    const TREAT_ICON = {
      "Invisible Aligners": "😁", "Microscopic Root Canal Treatment": "🔬", "Professional Cleaning & Scaling": "🪥",
      "Teeth Whitening": "✨", "Tooth-coloured Fillings": "🦷", "Crowns & Veneers (Smile Correction)": "💎",
      "Dental Implants": "🔩", "Gum Care Treatment": "🌸", "Routine Check-up": "🩺",
    };
    const URGENCY = {
      routine: { label: "Routine", bg: "var(--navy-soft)", fg: "var(--navy)", icon: "•" },
      soon: { label: "Check soon", bg: "var(--orange-soft)", fg: "#b8650a", icon: "!" },
      priority: { label: "Priority", bg: "#fdecea", fg: "#c0392b", icon: "!" },
    };

    function color(s) { return s >= 80 ? "#1f9d55" : s >= 65 ? "#1e3a6e" : s >= 45 ? "#f39322" : "#e0664f"; }
    function label(s) { return s >= 80 ? "Excellent" : s >= 65 ? "Healthy, with a few notes" : s >= 45 ? "Worth a check-up" : "Let's take a closer look"; }

    function ring(size, stroke, score, id) {
      const r = (size - stroke) / 2, c = 2 * Math.PI * r;
      return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#ececf0" stroke-width="${stroke}" fill="none"/>
        <circle ${id ? `id="${id}"` : ""} class="prog" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color(score)}" stroke-width="${stroke}" fill="none"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${id ? c : c * (1 - score / 100)}" data-final="${c * (1 - score / 100)}"/></svg>`;
    }

    // Fallbacks so older leads (analysed before the richer AI fields existed) still render nicely.
    function withFallbacks(a) {
      const cats = a.categories || {};
      const out = Object.assign({}, a);
      if (!out.patientSummary) {
        out.patientSummary = CATS.map((m) => cats[m.key] && cats[m.key].summary).filter(Boolean).slice(0, 3).join(" ");
      }
      if (!out.strengths) out.strengths = CATS.filter((m) => cats[m.key] && cats[m.key].score >= 75).map((m) => `${m.label} looks healthy`);
      if (!out.attentionAreas) out.attentionAreas = (a.detectedIssues || []).map((t) => ({ title: t, location: "", detail: "", urgency: "routine" }));
      if (!out.recommendedTreatments) out.recommendedTreatments = [{ service: "Routine Check-up", reason: "A quick in-person check confirms these AI findings.", fit: "strong" }];
      if (!out.habitInsights) out.habitInsights = [];
      return out;
    }

    function render(lead) {
      const a = withFallbacks(lead.analysis || {});
      const cats = a.categories || {};
      const score = lead.oralHealthScore || 0;
      const first = (lead.name || "").trim().split(" ")[0];
      const detail = a.alignmentDetail;
      const date = lead.timestamp ? new Date(lead.timestamp).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" }) : "";
      const attention = a.attentionAreas || [];
      const photos = (lead.photoUrls || []).map(normalizePhotoUrl);

      const metricsHtml = CATS.map((m) => {
        const c = cats[m.key] || { score: 0, summary: "" };
        return `<div class="card metric fade-up">
          <div class="metric-top">
            <div class="mini-ring">${ring(58, 6, c.score)}<span style="color:${color(c.score)}">${c.score}</span></div>
            <div><h3>${m.icon} ${m.label}</h3><span class="text-xs muted">${label(c.score)}</span></div>
          </div>
          <p>${esc(c.summary)}</p>
        </div>`;
      }).join("");

      const strengthsHtml = (a.strengths || []).length
        ? a.strengths.map((s) => `<div class="list-item"><div class="dot" style="background:var(--success-bg); color:var(--success);">✓</div><div class="li-detail" style="margin:0; align-self:center;">${esc(s)}</div></div>`).join("")
        : `<p class="text-sm muted">Your dentist will point out your strengths at your consultation.</p>`;

      const attentionHtml = attention.length
        ? attention.map((x) => {
            const u = URGENCY[x.urgency] || URGENCY.routine;
            return `<div class="list-item">
              <div class="dot" style="background:${u.bg}; color:${u.fg}; font-weight:700;">${u.icon}</div>
              <div style="flex:1;">
                <div class="flex justify-between items-center gap-8"><span class="li-title">${esc(x.title)}</span>
                  <span class="badge" style="background:${u.bg}; color:${u.fg};">${u.label}</span></div>
                ${x.location ? `<div class="li-loc">📍 ${esc(x.location)}</div>` : ""}
                ${x.detail ? `<div class="li-detail">${esc(x.detail)}</div>` : ""}
              </div></div>`;
          }).join("")
        : `<p class="text-sm muted">Nothing specific stood out — a great sign.</p>`;

      const treatHtml = (a.recommendedTreatments || []).map((t) => `
        <div class="card treat fade-up">
          <div class="flex justify-between items-center"><div class="treat-icon">${TREAT_ICON[t.service] || "🦷"}</div>
            <span class="badge ${t.fit === "strong" ? "badge-orange" : "badge-neutral"}">${t.fit === "strong" ? "Strong match" : "Worth discussing"}</span></div>
          <h3>${esc(t.service)}</h3>
          <p>${esc(t.reason)}</p>
          <a href="${BOOK}" target="_blank" rel="noopener">Ask about this →</a>
        </div>`).join("");

      const tipsHtml = (a.habitInsights || []).map((t, i) => `<div class="tip"><div class="tip-num">${i + 1}</div><div class="text-sm" style="padding-top:4px;">${esc(t)}</div></div>`).join("");

      const alignmentHtml = detail ? `
        <section class="section card fade-up">
          <h2 class="section-title">Your alignment map</h2>
          <p class="section-sub">Where crowding or spacing was noticed across your upper and lower teeth.</p>
          ${buildAlignmentDiagramSvg(detail)}
          ${alignmentDiagramLegendHtml()}
          ${detail.biteNote ? `<p class="text-sm muted center" style="margin:14px 0 0;">${esc(detail.biteNote)}</p>` : ""}
          ${detail.alignerCandidate ? `
            <div class="cta-inline card" style="margin-top:20px; box-shadow:none;">
              <div style="flex:1; min-width:220px;">
                <div class="eyebrow">Invisible Aligners</div>
                <p class="text-sm" style="margin:4px 0 0; color:#3a3a3c;">${esc(detail.alignerNote || "Your smile shows patterns clear aligners commonly correct.")} Amend's in-house aligner lab means faster turnaround.</p>
              </div>
              <a class="btn btn-orange" href="${BOOK}" target="_blank" rel="noopener">Check my aligner fit</a>
            </div>` : ""}
        </section>` : "";

      document.getElementById("reportRoot").innerHTML = `
        <section class="card hero fade-up">
          <span class="ai-tag">✦ AI Smile Report</span>
          <h1>${first ? `${esc(first)}, here's your smile snapshot` : "Here's your smile snapshot"}</h1>
          <p class="muted text-sm" style="margin:0;">${date} · ${esc(CLINIC)}</p>
          <div class="ring-wrap">${ring(210, 16, score, "mainRing")}
            <div class="ring-center"><div class="num" style="color:${color(score)}">${score}</div><div class="of">Oral Health Score</div></div>
          </div>
          <span class="gauge-label" style="background:${color(score)}1a; color:${color(score)};">${label(score)}</span>
          <div class="chips">
            <div class="chip"><b style="color:var(--success);">${(a.strengths || []).length}</b><span>Strengths</span></div>
            <div class="chip"><b style="color:var(--orange);">${attention.length}</b><span>Areas to review</span></div>
            <div class="chip"><b style="color:var(--navy);">${detail ? (detail.alignerCandidate ? "Likely" : "Not needed") : "—"}</b><span>Aligner fit</span></div>
          </div>
          ${a.photoQualityWarning ? `<p class="text-xs" style="color:var(--warning); background:var(--warning-bg); border-radius:10px; padding:8px 12px; margin:18px auto 0; display:inline-block;">📷 ${esc(a.photoQualityWarning)}</p>` : ""}
        </section>

        <section class="section card fade-up">
          <div class="summary-head"><div class="spark">✦</div><div><h2 class="section-title" style="font-size:18px;">Your AI summary</h2><span class="text-xs muted">Based on your photos and answers</span></div></div>
          <p class="summary">${esc(a.patientSummary)}</p>
        </section>

        <section class="section card cta-inline fade-up">
          <div style="flex:1; min-width:220px;">
            <div style="font-weight:700; font-size:16px;">Get these findings confirmed — free</div>
            <div class="text-sm muted">A quick consultation with our dentists turns this snapshot into a clear plan.</div>
          </div>
          <a class="btn btn-orange" href="${BOOK}" target="_blank" rel="noopener">Book free consultation</a>
        </section>

        ${photos.length ? `<section class="section card fade-up">
          <h2 class="section-title">Your photos</h2><p class="section-sub">What our AI analysed. Tap to view full size.</p>
          <div class="photos">${photos.map((u) => `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Your photo" loading="lazy" referrerpolicy="no-referrer"></a>`).join("")}</div>
        </section>` : ""}

        <section class="section">
          <h2 class="section-title" style="padding:0 6px;">Your 5 key measures</h2>
          <p class="section-sub" style="padding:0 6px;">Each scored out of 100 — higher is healthier.</p>
          <div class="metrics">${metricsHtml}</div>
        </section>

        <section class="section card fade-up">
          <h2 class="section-title">Your smile profile</h2>
          <p class="section-sub">Your scores (navy) compared with a typical healthy smile (dashed).</p>
          <div style="max-width:460px; margin:0 auto;" id="radar"></div>
        </section>

        ${a.rootCanalRiskFlag ? `<section class="section card fade-up" style="background:var(--orange-soft); border-color:#fde2c0;">
          <div class="flex gap-12 items-start"><div style="font-size:22px;">🔬</div><div>
            <div style="font-weight:700;">One tooth is worth having checked soon</div>
            <p class="text-sm" style="margin:4px 0 12px; color:#3a3a3c;">${esc(a.rootCanalRiskNote)} Amend's microscopic root canal care is designed to be precise and comfortable if treatment is ever needed.</p>
            <a class="btn btn-orange btn-sm" href="${BOOK}" target="_blank" rel="noopener">Get it checked free</a>
          </div></div></section>` : ""}

        <section class="section grid-2">
          <div class="card fade-up"><h2 class="section-title" style="font-size:18px;">What's going well</h2><p class="section-sub">Keep doing this.</p>${strengthsHtml}</div>
          <div class="card fade-up"><h2 class="section-title" style="font-size:18px;">Worth a closer look</h2><p class="section-sub">Most important first.</p>${attentionHtml}</div>
        </section>

        ${alignmentHtml}

        <section class="section">
          <h2 class="section-title" style="padding:0 6px;">Recommended for you at Amend</h2>
          <p class="section-sub" style="padding:0 6px;">Matched to your results — discuss any of these at your free consultation.</p>
          <div class="metrics">${treatHtml}</div>
        </section>

        ${tipsHtml ? `<section class="section card fade-up"><h2 class="section-title">Your daily care tips</h2><p class="section-sub">Personalised from your answers.</p>${tipsHtml}</section>` : ""}

        <section class="section card brand-gradient final-cta fade-up">
          <img src="assets/img/amend-mark.png" alt="" style="width:64px; margin:0 auto; background:#fff; border-radius:999px; padding:4px;">
          <h2>Your free consultation is one message away</h2>
          <p>Our dentists will review this report with you, answer your questions, and build a plan that fits you — no obligation.</p>
          <div class="flex gap-12" style="justify-content:center; flex-wrap:wrap;">
            <a class="btn btn-orange btn-lg" href="${BOOK}" target="_blank" rel="noopener">Book my free consultation</a>
            <a class="btn btn-white btn-lg" href="${SITE}" target="_blank" rel="noopener">Visit amenddental.in</a>
          </div>
          <p class="text-xs" style="margin:20px auto 0;">${esc(cfg("BRANCHES", ""))}</p>
        </section>

        <section class="section card disclaimer">
          <div style="font-size:20px;">ⓘ</div>
          <div>
            <div style="font-weight:600; font-size:14px; margin-bottom:4px;">This report is AI-generated</div>
            <p>It is an automated visual screening based on your photos and answers, created to help you understand your oral health — not a medical diagnosis. Photo quality, lighting and angle affect accuracy, and some conditions can only be detected with an in-person exam or X-ray. Please consult a qualified dentist before making any treatment decision. ${a.professionalAdviceNote ? esc(a.professionalAdviceNote) : ""}</p>
          </div>
        </section>

        <footer class="center" style="padding:30px 0 10px;">
          <img src="assets/img/amend-logo.png" alt="Amend Dental Centre" style="height:30px; margin:0 auto 8px; opacity:.85;">
          <p class="text-xs muted" style="margin:0;"><a href="${SITE}" target="_blank" rel="noopener" style="color:var(--navy);">amenddental.in</a> · ${esc(cfg("BRANCHES", ""))}</p>
        </footer>`;

      requestAnimationFrame(() => {
        const r = document.getElementById("mainRing");
        if (r) setTimeout(() => r.setAttribute("stroke-dashoffset", r.dataset.final), 80);
      });

      document.getElementById("radar").innerHTML = radarSvg(CATS.map((m) => ({ label: ({ stainingColor: "Shade", enamelWear: "Enamel", decayCavities: "Cavities", gumHealth: "Gums" })[m.key] || m.label, value: (cats[m.key] || {}).score || 0 })));
    }

    // Dependency-free SVG radar: your scores vs a healthy-smile reference ring.
    function radarSvg(items) {
      const W = 520, H = 390, cx = W / 2, cy = H / 2 + 6, R = 130, n = items.length;
      const pt = (i, v) => { const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + Math.cos(ang) * R * v / 100, cy + Math.sin(ang) * R * v / 100]; };
      const poly = (vals) => vals.map((v, i) => pt(i, v).join(",")).join(" ");
      let g = "";
      [25, 50, 75, 100].forEach((lv) => (g += `<polygon points="${poly(items.map(() => lv))}" fill="none" stroke="#ececf0" stroke-width="1"/>`));
      items.forEach((_, i) => { const [x, y] = pt(i, 100); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ececf0"/>`; });
      g += `<polygon points="${poly(items.map(() => 85))}" fill="none" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="5 5"/>`;
      g += `<polygon class="radar-shape" points="${poly(items.map((it) => it.value))}" fill="rgba(30,58,110,.16)" stroke="#1e3a6e" stroke-width="2.5" stroke-linejoin="round"/>`;
      items.forEach((it, i) => {
        const [x, y] = pt(i, it.value); g += `<circle cx="${x}" cy="${y}" r="5" fill="#f39322" stroke="#fff" stroke-width="2"/>`;
        const [lx, ly] = pt(i, 122); const anchor = Math.abs(lx - cx) < 10 ? "middle" : lx > cx ? "start" : "end";
        g += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="12.5" font-weight="600" fill="#3a3a3c">${it.label}</text>`;
        g += `<text x="${lx}" y="${ly + 15}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11.5" fill="${color(it.value)}" font-weight="700">${it.value}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>
        <div class="flex gap-16 text-xs muted" style="justify-content:center; margin-top:6px;">
          <span><span style="display:inline-block; width:18px; height:3px; background:#1e3a6e; vertical-align:middle; border-radius:2px;"></span> You</span>
          <span><span style="display:inline-block; width:18px; border-top:2px dashed #c7c7cc; vertical-align:middle;"></span> Healthy smile</span></div>`;
    }

    window.addEventListener("scroll", () => {
      document.getElementById("stickyCta").classList.toggle("show", window.scrollY > 500);
    });

    const leadId = new URLSearchParams(location.search).get("id");
    if (!leadId) {
      document.getElementById("reportRoot").innerHTML = '<p class="center muted" style="padding:60px 0;">No report ID given.</p>';
    } else {
      callApi("getReport", { leadId })
        .then((d) => d.lead ? render(d.lead) : (document.getElementById("reportRoot").innerHTML = '<p class="center muted" style="padding:60px 0;">Report not found.</p>'))
        .catch((err) => (document.getElementById("reportRoot").innerHTML = `<p class="center muted" style="padding:60px 0;">${esc(err.message || "Could not load this report.")}</p>`));
    }
  </script>
</body>
</html>
