<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login</title>
<link rel="icon" href="assets/img/amend-mark.png" />
<link rel="stylesheet" href="assets/css/styles.css" />
<style>
  body { background: var(--bg); }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { width: 100%; max-width: 360px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="center" style="margin-bottom:28px;">
        <img src="assets/img/amend-logo.png" alt="Amend Dental Centre" style="height:44px; margin:0 auto 14px;">
        <div style="font-weight:700;">AI Smile Check · Admin</div>
        <div class="text-sm muted">Sign in to manage leads &amp; settings</div>
      </div>
      <form class="card" id="loginForm" style="box-shadow:0 20px 40px -10px rgba(0,0,0,0.4);">
        <div class="field">
          <label class="field-label">Username</label>
          <input type="text" id="username" required autofocus />
        </div>
        <div class="field">
          <label class="field-label">Password</label>
          <input type="password" id="password" required />
        </div>
        <p id="loginError" class="text-sm" style="color:var(--danger); display:none; margin-bottom:12px;"></p>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">🔒 Sign in</button>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    if (getAdminToken()) window.location.href = "admin-dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        const resp = await callApi("adminLogin", {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        });
        setAdminToken(resp.token);
        window.location.href = "admin-dashboard.html";
      } catch (err) {
        errEl.textContent = err.message || "Login failed.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "🔒 Sign in";
      }
    });
  </script>
</body>
</html>
