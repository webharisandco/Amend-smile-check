<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assessment Questions</title>
<link rel="stylesheet" href="assets/css/styles.css" />
<style>
  .q-card { padding: 18px; }
  .q-row { display: flex; align-items: flex-start; gap: 10px; }
  .q-order-btns { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .q-order-btns button { border: none; background: #f1f5f9; border-radius: 6px; width: 22px; height: 18px; font-size: 10px; cursor: pointer; line-height: 1; }
  .q-order-btns button:hover { background: #e2e8f0; }
  .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .opt-row input[type="text"] { flex: 1; padding: 6px 10px; font-size: 13px; }
  .opt-remove { border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; }
  .opt-remove:hover { color: var(--danger); }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .meta-grid select { font-size: 13px; padding: 8px 10px; }
  .type-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #475569; }
</style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main" style="max-width:820px;">
      <div class="flex justify-between items-center mb-16" style="flex-wrap:wrap; gap:10px;">
        <div>
          <h1 style="font-size:20px; font-weight:800; margin:0;">Assessment Questions</h1>
          <p class="text-sm muted" id="countLabel" style="margin:4px 0 0;">This is a self-report intake form, not a graded quiz — every active question is shown, in order, on every test.</p>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-outline btn-sm" id="addBtn">➕ Add question</button>
          <button class="btn btn-primary btn-sm" id="saveBtn">💾 Save all</button>
        </div>
      </div>
      <div id="questionsRoot"><p class="muted">Loading…</p></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin-common.js"></script>
  <script>
    requireAdminAuth();
    renderSidebar("questions");

    const TYPE_LABELS = { number: "Number", text: "Free text", yes_no: "Yes / No", single_choice: "Multiple choice" };
    let questions = [];

    function blankQuestion() {
      return {
        id: "new-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        text: "", type: "single_choice", options: ["", ""], category: "custom",
        dependsOnId: "", dependsOnValue: "", active: true, order: questions.length + 1,
      };
    }

    function possibleDependencies(qi) {
      // Only prior yes_no / single_choice questions can gate a later one.
      return questions.slice(0, qi).filter((q) => q.type === "yes_no" || q.type === "single_choice");
    }

    function renderList() {
      const activeCount = questions.filter((q) => q.active).length;
      document.getElementById("countLabel").textContent =
        `${activeCount} active question(s), shown in order on every test — not shuffled or graded.`;

      const root = document.getElementById("questionsRoot");
      if (questions.length === 0) {
        root.innerHTML = '<p class="center muted" style="padding:40px 0;">No questions yet — add one to get started.</p>';
        return;
      }

      root.innerHTML = questions.map((q, qi) => {
        const deps = possibleDependencies(qi);
        const depOptions = q.type === "yes_no" || q.type === "single_choice" ? [] : deps; // n/a, unused
        return `
        <div class="card q-card" data-idx="${qi}">
          <div class="q-row">
            <div class="q-order-btns">
              <button class="q-up" ${qi === 0 ? "disabled" : ""} title="Move up">▲</button>
              <button class="q-down" ${qi === questions.length - 1 ? "disabled" : ""} title="Move down">▼</button>
            </div>
            <div style="flex:1; min-width:0;">
              <div class="flex items-center gap-8 mb-8" style="flex-wrap:wrap;">
                <span class="text-xs muted" style="width:20px;">#${qi + 1}</span>
                <input type="text" class="q-text" value="${escapeHtml(q.text)}" placeholder="Question text" style="flex:1; min-width:180px;" />
                <span class="type-badge">${TYPE_LABELS[q.type] || q.type}</span>
                <label class="text-xs flex items-center gap-8" style="white-space:nowrap;">
                  <input type="checkbox" class="q-active" ${q.active ? "checked" : ""} /> Active
                </label>
                <button class="btn btn-ghost btn-sm q-delete" title="Delete">🗑️</button>
              </div>

              <div class="meta-grid">
                <div>
                  <label class="field-label text-xs">Answer type</label>
                  <select class="q-type">
                    <option value="single_choice" ${q.type === "single_choice" ? "selected" : ""}>Multiple choice</option>
                    <option value="yes_no" ${q.type === "yes_no" ? "selected" : ""}>Yes / No</option>
                    <option value="number" ${q.type === "number" ? "selected" : ""}>Number</option>
                    <option value="text" ${q.type === "text" ? "selected" : ""}>Free text (optional)</option>
                  </select>
                </div>
                <div>
                  <label class="field-label text-xs">Only ask this if…</label>
                  <div class="flex gap-8">
                    <select class="q-dep-id" style="flex:1;">
                      <option value="">Always ask</option>
                      ${deps.map((d) => `<option value="${d.id}" ${q.dependsOnId === d.id ? "selected" : ""}>${escapeHtml(d.text || d.id)}</option>`).join("")}
                    </select>
                    <select class="q-dep-val" style="flex:1;" ${q.dependsOnId ? "" : "disabled"}>
                      ${dependencyValueOptions(questions.find((x) => x.id === q.dependsOnId), q.dependsOnValue)}
                    </select>
                  </div>
                </div>
              </div>

              <div class="q-options-wrap mt-8" style="${q.type === "single_choice" ? "" : "display:none;"}">
                <label class="field-label text-xs">Options</label>
                <div class="q-options">
                  ${q.options.map((opt, oi) => `
                    <div class="opt-row" data-oi="${oi}">
                      <input type="text" value="${escapeHtml(opt)}" placeholder="Option ${oi + 1}" />
                      <button class="opt-remove" title="Remove option">✕</button>
                    </div>`).join("")}
                </div>
                <button class="btn btn-ghost btn-sm q-add-option">➕ Add option</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join("");

      wireCardEvents();
    }

    function dependencyValueOptions(depQuestion, currentValue) {
      if (!depQuestion) return '<option value="">—</option>';
      const values = depQuestion.type === "yes_no" ? ["Yes", "No"] : depQuestion.options;
      return values.map((v) => `<option value="${escapeHtml(v)}" ${currentValue === v ? "selected" : ""}>${escapeHtml(v)}</option>`).join("");
    }

    function wireCardEvents() {
      document.querySelectorAll(".q-card").forEach((card) => {
        const qi = Number(card.dataset.idx);
        const q = questions[qi];

        card.querySelector(".q-text").addEventListener("input", (e) => { q.text = e.target.value; });
        card.querySelector(".q-active").addEventListener("change", (e) => { q.active = e.target.checked; });
        card.querySelector(".q-delete").addEventListener("click", () => {
          // clear any dependency that pointed at this question
          questions.forEach((other) => { if (other.dependsOnId === q.id) { other.dependsOnId = ""; other.dependsOnValue = ""; } });
          questions.splice(qi, 1);
          renderList();
        });
        card.querySelector(".q-up").addEventListener("click", () => {
          if (qi === 0) return;
          [questions[qi - 1], questions[qi]] = [questions[qi], questions[qi - 1]];
          renderList();
        });
        card.querySelector(".q-down").addEventListener("click", () => {
          if (qi === questions.length - 1) return;
          [questions[qi + 1], questions[qi]] = [questions[qi], questions[qi + 1]];
          renderList();
        });

        card.querySelector(".q-type").addEventListener("change", (e) => {
          q.type = e.target.value;
          if (q.type === "single_choice" && q.options.length === 0) q.options = ["", ""];
          renderList();
        });

        card.querySelector(".q-dep-id").addEventListener("change", (e) => {
          q.dependsOnId = e.target.value;
          const depQuestion = questions.find((x) => x.id === q.dependsOnId);
          q.dependsOnValue = depQuestion ? (depQuestion.type === "yes_no" ? "Yes" : (depQuestion.options[0] || "")) : "";
          renderList();
        });
        const depValEl = card.querySelector(".q-dep-val");
        if (depValEl) depValEl.addEventListener("change", (e) => { q.dependsOnValue = e.target.value; });

        card.querySelectorAll(".opt-row").forEach((row) => {
          const oi = Number(row.dataset.oi);
          row.querySelector("input").addEventListener("input", (e) => { q.options[oi] = e.target.value; });
          row.querySelector(".opt-remove").addEventListener("click", () => {
            q.options.splice(oi, 1);
            renderList();
          });
        });
        const addOptBtn = card.querySelector(".q-add-option");
        if (addOptBtn) addOptBtn.addEventListener("click", () => {
          q.options.push("");
          renderList();
        });
      });
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      questions.push(blankQuestion());
      renderList();
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = "Saving…";
      try {
        questions.forEach((q, i) => {
          q.order = i + 1;
          if (q.type !== "single_choice") q.options = [];
          else q.options = q.options.map((o) => o.trim()).filter((o) => o);
        });
        await callAdminApi("saveQuestions", { questions });
        btn.textContent = "Saved!";
        setTimeout(() => (btn.textContent = originalText), 1500);
      } catch (err) {
        alert(err.message || "Could not save.");
        btn.textContent = originalText;
      } finally {
        btn.disabled = false;
      }
    });

    callAdminApi("getAdminQuestions", {}).then((d) => {
      questions = d.questions || [];
      renderList();
    }).catch((err) => {
      document.getElementById("questionsRoot").innerHTML =
        `<p style="color:var(--danger);">${escapeHtml(err.message)}</p>`;
    });
  </script>
</body>
</html>
