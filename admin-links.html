<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Share Links</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <div class="admin-main" style="max-width:700px;">
      <h1 style="font-size:20px; font-weight:800; margin:0 0 4px;">Share Links</h1>
      <p class="text-sm muted mb-16">Generate trackable test links for Instagram bio, WhatsApp broadcasts, in-clinic QR codes, etc.</p>

      <div class="card mb-16">
        <h2 style="font-size:14px; margin:0 0 14px;">New link</h2>
        <div class="grid-2">
          <div class="field">
            <label class="field-label">Label (for your reference)</label>
            <input type="text" id="labelInput" placeholder="Instagram bio link" />
          </div>
          <div class="field">
            <label class="field-label">Custom code (optional)</label>
            <input type="text" id="codeInput" placeholder="instagram" />
          </div>
        </div>
        <button class="btn btn-primary" id="createBtn">➕ Generate link</button>
      </div>

      <div class="card" style="padding:0;" id="linksCard">
        <p class="center muted" style="padding:40px 0;">Loading…</p>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin-common.js"></script>
  <script>
    requireAdminAuth();
    renderSidebar("links");

    const origin = window.location.origin + window.location.pathname.replace(/admin-links\.html$/, "");

    function renderLinks(links) {
      const card = document.getElementById("linksCard");
      if (!links.length) {
        card.innerHTML = '<p class="center muted" style="padding:40px 0;">No links yet — generate your first one above.</p>';
        return;
      }
      card.innerHTML = links.map((l) => `
        <div class="flex items-center gap-12" style="padding:14px 16px; border-bottom:1px solid var(--border);">
          <div style="background:var(--brand-light); color:var(--brand-dark); border-radius:10px; padding:8px 10px;">🔗</div>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:600; font-size:13.5px;">${escapeHtml(l.label)}</div>
            <div class="text-xs muted" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${origin}test.html?ref=${l.code}</div>
          </div>
          <button class="btn btn-outline btn-sm copy-btn" data-code="${l.code}">📋 Copy</button>
          <button class="btn btn-ghost btn-sm delete-btn" data-code="${l.code}">🗑️</button>
        </div>`).join("");

      card.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          navigator.clipboard.writeText(`${origin}test.html?ref=${btn.dataset.code}`);
          const orig = btn.textContent;
          btn.textContent = "✅ Copied";
          setTimeout(() => (btn.textContent = orig), 1500);
        });
      });
      card.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const d = await callAdminApi("deleteLink", { code: btn.dataset.code });
          renderLinks(d.links || []);
        });
      });
    }

    document.getElementById("createBtn").addEventListener("click", async () => {
      const label = document.getElementById("labelInput").value;
      const code = document.getElementById("codeInput").value;
      const btn = document.getElementById("createBtn");
      btn.disabled = true;
      try {
        const d = await callAdminApi("saveLink", { label, code });
        renderLinks(d.links || []);
        document.getElementById("labelInput").value = "";
        document.getElementById("codeInput").value = "";
      } finally {
        btn.disabled = false;
      }
    });

    callAdminApi("getLinks", {}).then((d) => renderLinks(d.links || [])).catch((err) => {
      document.getElementById("linksCard").innerHTML =
        `<p style="color:var(--danger); padding:20px;">${escapeHtml(err.message)}</p>`;
    });
  </script>
</body>
</html>
